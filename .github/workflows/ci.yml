name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNU Octave
        run: |
          sudo apt-get update -y
          sudo apt-get install -y octave

      - name: Show Octave version
        run: octave --version

      - name: Run test suite
        run: |
          octave-cli --no-gui --quiet --eval "run('tests/run_all_tests.m');"

      - name: Run demo suite
        run: |
          octave-cli --no-gui --quiet --eval "run('demos/run_all_demos.m');"

      - name: Upload figure artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: octave-figures
          path: output/figures/*.png
          retention-days: 30
